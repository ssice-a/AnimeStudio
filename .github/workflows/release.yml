name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify release tag matches application version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = 'v' + $props.Project.PropertyGroup.Version
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Missing tag $env:RELEASE_TAG" }
          if ($version -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match AnimeStudio $version"
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Build and package GUI and CLI
        shell: pwsh
        run: ./build.ps1
      - name: Archive both supported frameworks
        shell: pwsh
        run: |
          foreach ($framework in 'net9.0-windows', 'net10.0-windows') {
            $source = Join-Path dist $framework
            if (-not (Test-Path $source)) { throw "Missing $source" }
            Compress-Archive -Path "$source/*" -DestinationPath "AnimeStudio_$($env:RELEASE_TAG)_$framework.zip"
          }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: AnimeStudio_${{ env.RELEASE_TAG }}_*.zip
          generate_release_notes: true
